<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>导航面板 - Sun-Panel2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          const root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            root.innerHTML = '<div style="color:white;padding:20px;text-align:center;font-family:sans-serif;">' +
              '<h3>资源加载失败 / Resources Failed to Load</h3>' +
              '<p style="opacity:0.6;">Could not load: ' + e.target.src + (e.target.href || '') + '</p>' +
              '<p style="font-size:14px;opacity:0.8;">这通常是因为二级路径(如 Github Pages)未添加末尾斜杠。请确保您的访问地址以斜杠结尾，例如: <br/><b>' + location.origin + location.pathname + (location.pathname.endsWith('/') ? '' : '/') + '</b></p>' +
              '</div>';
          }
        }
      }, true);
      window.onerror = function(msg) {
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = '<div style="color:white;padding:20px;text-align:center;font-family:sans-serif;">' +
            '<h3>程序启动失败 / App Failed to Start</h3>' +
            '<p style="opacity:0.6;">' + msg + '</p>' +
            '<p style="font-size:12px;opacity:0.4;">如果是部署在二级路径，请确保已使用 HashRouter 并开启了相对路径支持。</p>' +
            '</div>';
        }
      };
    </script>
  </body>
</html>
